<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report a Scandal</title>
    <style>
        .error { color: red; }
    </style>
</head>
<body>
<h1>Report a Scandal</h1>

<form th:action="@{/report}" th:object="${report}" method="post">

    <div>
        <label for="scandalName">Scandal Name:</label>
        <input type="text" id="scandalName" th:field="*{scandalName}" />
        <span class="error" th:if="${#fields.hasErrors('scandalName')}" th:errors="*{scandalName}"></span>
    </div>
    <br>

    <div>
        <label for="scandalDescription">Description:</label>
        <textarea id="scandalDescription" th:field="*{scandalDescription}"></textarea>
        <span class="error" th:if="${#fields.hasErrors('scandalDescription')}" th:errors="*{scandalDescription}"></span>
    </div>
    <br>

    <div>
        <label for="sources">Sources (Links, Evidence):</label>
        <textarea id="sources" th:field="*{sources}"></textarea>
    </div>
    <br>

    <div>
        <label for="additionalComments">Additional Comments:</label>
        <textarea id="additionalComments" th:field="*{additionalComments}"></textarea>
    </div>
    <br>

    <button type="submit">Submit Report</button>
</form>

<br>
<a th:href="@{/all-scandals}">Cancel and Go Back</a>
</body>
</html>
