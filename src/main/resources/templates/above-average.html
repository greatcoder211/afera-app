<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Above Average Scandals</title>
</head>
<body>
<h1>High-Profile Scandals (Above Average Embezzlement)</h1>

<table border="1" cellpadding="5">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Confirmed Amount ($)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="scandal : ${scandals}">
        <td th:text="${scandal.id}"></td>
        <td th:text="${scandal.name}"></td>
        <td style="color: green; font-weight: bold;" th:text="${scandal.confirmedEmbezzledAmountOfMoney}"></td>
    </tr>
    </tbody>
</table>

<p th:if="${scandals.isEmpty()}" style="color: red;">Not enough data to calculate an average, or no scandals exceed it.</p>

<br>
<a th:href="@{/admin}">Back to Admin Dashboard</a>
</body>
</html>
