# 1. H2 Console
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# 2. Database URL
spring.datasource.url=jdbc:mysql://localhost:3306/afera_db?serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. SQL Data
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID_NEW}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET_NEW}

